openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: CCNA Learning SaaS API foundation
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: learning
    description: Learner-facing read operations
  - name: practice
    description: Authenticated practice question and answer operations
  - name: auth
    description: Clerk-backed authentication state
  - name: admin
    description: Server-side administrator boundary
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /topics:
    get:
      operationId: listTopics
      tags: [learning]
      summary: List active CCNA topics
      description: Returns the active topic catalog with foundation-level progress fields.
      responses:
        "200":
          description: Topic summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopicSummary"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [learning]
      summary: Get the learning dashboard summary
      description: Returns aggregate learning metrics for the current foundation experience.
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /learning/progress:
    get:
      operationId: getLearningProgress
      tags:
        - learning
      summary: Get the authenticated learner learning progress
      description: Phase 5C.1 contract only; runtime implementation is scheduled for Phase 5C.2. Returns all-time historical attempt metrics and current available-catalog coverage for the authenticated internal user. Accepts no query parameters or request body; client-supplied userId is rejected. USER and ADMIN accounts receive only their own metrics. Does not include study time, streak days or average duration. See docs/api/learning-progress.md for cohort, rounding and topic-movement rules.
      security:
        - clerkSession: []
      parameters: []
      responses:
        "200":
          description: User-scoped learning summary and per-topic statistics
          headers:
            Cache-Control:
              description: All responses from this private endpoint must prevent storage of personal metrics.
              schema:
                type: string
                enum:
                  - private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProgressResponse"
              examples:
                threeAttempts:
                  summary: Three attempts, two correct, two historical questions
                  description: "Q1 in topic A: correct then incorrect; Q2 in topic A: correct. Q3 is available but unattempted."
                  value:
                    summary:
                      totalAttempts: 3
                      correctAttempts: 2
                      overallAccuracy: 66.67
                      uniqueQuestionsAttempted: 2
                      availableQuestionCount: 3
                      coveredQuestionCount: 2
                      coveragePercent: 66.67
                    topics:
                      - topicId: 11111111-1111-4111-8111-111111111111
                        topicName: Routing fundamentals
                        status: ACTIVE
                        displayOrder: 1
                        totalAttempts: 3
                        correctAttempts: 2
                        accuracy: 66.67
                        uniqueQuestionsAttempted: 2
                        availableQuestionCount: 3
                        coveredQuestionCount: 2
                        coveragePercent: 66.67
                noAttempts:
                  summary: No attempts with two available questions
                  description: The current catalog has Q1 and Q2 in active topic A. This user has no attempts.
                  value:
                    summary:
                      totalAttempts: 0
                      correctAttempts: 0
                      overallAccuracy: 0
                      uniqueQuestionsAttempted: 0
                      availableQuestionCount: 2
                      coveredQuestionCount: 0
                      coveragePercent: 0
                    topics:
                      - topicId: 11111111-1111-4111-8111-111111111111
                        topicName: Routing fundamentals
                        status: ACTIVE
                        displayOrder: 1
                        totalAttempts: 0
                        correctAttempts: 0
                        accuracy: 0
                        uniqueQuestionsAttempted: 0
                        availableQuestionCount: 2
                        coveredQuestionCount: 0
                        coveragePercent: 0
                repeatedQuestion:
                  summary: Five attempts on the same question
                  description: Q1 was attempted five times, three correctly. Q2 is also available but unattempted. Attempts are five; distinct questions and covered questions are one.
                  value:
                    summary:
                      totalAttempts: 5
                      correctAttempts: 3
                      overallAccuracy: 60
                      uniqueQuestionsAttempted: 1
                      availableQuestionCount: 2
                      coveredQuestionCount: 1
                      coveragePercent: 50
                    topics:
                      - topicId: 11111111-1111-4111-8111-111111111111
                        topicName: Routing fundamentals
                        status: ACTIVE
                        displayOrder: 1
                        totalAttempts: 5
                        correctAttempts: 3
                        accuracy: 60
                        uniqueQuestionsAttempted: 1
                        availableQuestionCount: 2
                        coveredQuestionCount: 1
                        coveragePercent: 50
                disabledQuestion:
                  summary: Historical results remain after disabling Q1
                  description: Starting from threeAttempts, Q1 and unattempted Q3 are disabled. Only Q2 remains available and covered. Historical totals stay unchanged.
                  value:
                    summary:
                      totalAttempts: 3
                      correctAttempts: 2
                      overallAccuracy: 66.67
                      uniqueQuestionsAttempted: 2
                      availableQuestionCount: 1
                      coveredQuestionCount: 1
                      coveragePercent: 100
                    topics:
                      - topicId: 11111111-1111-4111-8111-111111111111
                        topicName: Routing fundamentals
                        status: ACTIVE
                        displayOrder: 1
                        totalAttempts: 3
                        correctAttempts: 2
                        accuracy: 66.67
                        uniqueQuestionsAttempted: 2
                        availableQuestionCount: 1
                        coveredQuestionCount: 1
                        coveragePercent: 100
                movedQuestion:
                  summary: Q1 moves from topic A to topic B
                  description: One correct attempt was recorded while Q1 belonged to topic A. Q1 is now the sole available question in active topic B. Historical attribution stays in A; current coverage moves to B.
                  value:
                    summary:
                      totalAttempts: 1
                      correctAttempts: 1
                      overallAccuracy: 100
                      uniqueQuestionsAttempted: 1
                      availableQuestionCount: 1
                      coveredQuestionCount: 1
                      coveragePercent: 100
                    topics:
                      - topicId: 11111111-1111-4111-8111-111111111111
                        topicName: Routing fundamentals
                        status: ACTIVE
                        displayOrder: 1
                        totalAttempts: 1
                        correctAttempts: 1
                        accuracy: 100
                        uniqueQuestionsAttempted: 1
                        availableQuestionCount: 0
                        coveredQuestionCount: 0
                        coveragePercent: 0
                      - topicId: 22222222-2222-4222-8222-222222222222
                        topicName: Network access
                        status: ACTIVE
                        displayOrder: 2
                        totalAttempts: 0
                        correctAttempts: 0
                        accuracy: 0
                        uniqueQuestionsAttempted: 0
                        availableQuestionCount: 1
                        coveredQuestionCount: 1
                        coveragePercent: 100
                disabledTopic:
                  summary: Disabled topic with this user historical attempts
                  description: Topic A is disabled after one correct attempt at Q1. It is retained for this user historical statistics, with zero availability and coverage. Active topic B has two unattempted questions. Other disabled topics without this user history are omitted.
                  value:
                    summary:
                      totalAttempts: 1
                      correctAttempts: 1
                      overallAccuracy: 100
                      uniqueQuestionsAttempted: 1
                      availableQuestionCount: 2
                      coveredQuestionCount: 0
                      coveragePercent: 0
                    topics:
                      - topicId: 11111111-1111-4111-8111-111111111111
                        topicName: Routing fundamentals
                        status: DISABLED
                        displayOrder: 1
                        totalAttempts: 1
                        correctAttempts: 1
                        accuracy: 100
                        uniqueQuestionsAttempted: 1
                        availableQuestionCount: 0
                        coveredQuestionCount: 0
                        coveragePercent: 0
                      - topicId: 22222222-2222-4222-8222-222222222222
                        topicName: Network access
                        status: ACTIVE
                        displayOrder: 2
                        totalAttempts: 0
                        correctAttempts: 0
                        accuracy: 0
                        uniqueQuestionsAttempted: 0
                        availableQuestionCount: 2
                        coveredQuestionCount: 0
                        coveragePercent: 0
                emptyCatalog:
                  summary: No available catalog and no user history
                  description: There are no active topics and no attempts for this user. All counters and percentages are zero and topics is an empty array.
                  value:
                    summary:
                      totalAttempts: 0
                      correctAttempts: 0
                      overallAccuracy: 0
                      uniqueQuestionsAttempted: 0
                      availableQuestionCount: 0
                      coveredQuestionCount: 0
                      coveragePercent: 0
                    topics: []
        "400":
          description: Unsupported query parameters or request body, including client-supplied userId
          headers:
            Cache-Control:
              description: All responses from this private endpoint must prevent storage of personal metrics.
              schema:
                type: string
                enum:
                  - private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authenticated Clerk identity could not be verified
          headers:
            Cache-Control:
              description: All responses from this private endpoint must prevent storage of personal metrics.
              schema:
                type: string
                enum:
                  - private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated account is disabled
          headers:
            Cache-Control:
              description: All responses from this private endpoint must prevent storage of personal metrics.
              schema:
                type: string
                enum:
                  - private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Progress could not be loaded; internal error details are not exposed
          headers:
            Cache-Control:
              description: All responses from this private endpoint must prevent storage of personal metrics.
              schema:
                type: string
                enum:
                  - private, no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current application user
      description: Returns the local user bridge for the authenticated Clerk session.
      security:
        - clerkSession: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/access:
    get:
      operationId: getAdminAccess
      tags: [admin]
      summary: Check the server-side administrator boundary
      description: This foundation endpoint proves that ADMIN authorization is enforced by the server.
      security:
        - clerkSession: []
      responses:
        "200":
          description: Administrator access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessResponse"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated user is not an administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /questions/{id}:
    get:
      operationId: getQuestion
      tags: [questions]
      summary: Get an active question for learners
      description: Returns an ACTIVE question in an ACTIVE topic. Disabled questions return 404. Correct answers are never included.
      security:
        - clerkSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Learner question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerQuestion"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Question not found or not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /practice/history:
    get:
      operationId: getPracticeHistory
      tags: [practice]
      summary: List authenticated user's practice attempts
      description: Returns only the authenticated user's attempts, newest first, using cursor-based pagination. Display details are opt-in and use the topic recorded at submission, even when the question moves or either record is disabled.
      security:
        - clerkSession: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque pagination cursor returned by a previous response.
        - name: includeDetails
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include revision review and historical-content availability plus question/topic labels. Omitted or false preserves the original response.
      responses:
        "200":
          description: Paginated practice attempt history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeHistoryResponse"
        "400":
          description: Invalid pagination parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Practice history could not be fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /practice/topics/{topicId}/question:
    get:
      operationId: getPracticeQuestion
      tags: [practice]
      summary: Fetch a practice question for an active topic
      description: Captures immutable content and issues one user/session-bound delivery, expiring after 24 hours. Returns one random ACTIVE question from an ACTIVE topic without answer keys or explanations. Each read issues a new delivery; responses must not be shared or cached across actors.
      security:
        - clerkSession: []
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Safe practice question, before answer submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeQuestion"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Topic is not active or has no active questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Practice question could not be fetched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /practice/questions/{questionId}/answer:
    post:
      operationId: submitPracticeAnswer
      tags: [practice]
      summary: Submit and grade an answer to an active practice question
      description: Grades only the immutable revision bound to the delivery issued to the verified user/session. Requires deliveryId; older clients must reload and upgrade. Same-answer retries return the original result without another attempt; changed-answer retries, missing deliveries and expired unsubmitted deliveries return 409. Active availability is rechecked before the first write. Already accepted requests may finish after browser switching.
      security:
        - clerkSession: []
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeAnswerInput"
      responses:
        "200":
          description: Server-graded answer result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeAnswerResult"
        "400":
          description: Invalid request or selected option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Account is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Question is not active or its topic is not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Delivery required or expired, or retry conflicts with its accepted answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Practice answer could not be submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/topics:
    get:
      operationId: adminListTopics
      tags: [admin]
      summary: List all topics including disabled (ADMIN)
      security:
        - clerkSession: []
      responses:
        "200":
          description: All topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTopic"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an administrator or account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: adminCreateTopic
      tags: [admin]
      summary: Create a topic (ADMIN)
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminSessionPrecondition"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTopicCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTopic"
        "400":
          description: Invalid data or malformed admin session precondition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an administrator or account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate slug or admin session changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/topics/{id}:
    patch:
      operationId: adminUpdateTopic
      tags: [admin]
      summary: Update a topic (ADMIN)
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminSessionPrecondition"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTopicUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTopic"
        "400":
          description: Invalid data or malformed admin session precondition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an administrator or account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Topic not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Duplicate slug or admin session changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/topics/{id}/disable:
    post:
      operationId: adminDisableTopic
      tags: [admin]
      summary: Disable a topic (kept in database) (ADMIN)
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminSessionPrecondition"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTopic"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an administrator or account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Topic not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Malformed admin session precondition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Admin session changed; no question or topic mutation performed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/questions:
    get:
      operationId: adminListQuestions
      tags: [admin]
      summary: List questions with pagination and filters (ADMIN)
      security:
        - clerkSession: []
      parameters:
        - name: topicId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, DISABLED]
        - name: difficulty
          in: query
          schema:
            type: string
            enum: [EASY, MEDIUM, HARD]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: Paginated questions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestionListResponse"
        "400":
          description: Invalid filter or pagination value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an administrator or account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: adminCreateQuestion
      tags: [admin]
      summary: Create a single-correct multiple-choice question (ADMIN)
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminSessionPrecondition"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminQuestionCreate"
      responses:
        "201":
          description: Created with a database-generated immutable question code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestion"
        "400":
          description: Invalid data or malformed admin session precondition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an administrator or account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Admin session changed; no question or topic mutation performed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/questions/{id}:
    patch:
      operationId: adminUpdateQuestion
      tags: [admin]
      summary: Update a question and optionally replace its options (ADMIN)
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminSessionPrecondition"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminQuestionUpdate"
      responses:
        "200":
          description: Updated; question code is unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestion"
        "400":
          description: Invalid data or malformed admin session precondition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an administrator or account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Question not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Admin session changed; no question or topic mutation performed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/questions/{id}/disable:
    post:
      operationId: adminDisableQuestion
      tags: [admin]
      summary: Disable a question without deleting it (ADMIN)
      security:
        - clerkSession: []
      parameters:
        - $ref: "#/components/parameters/AdminSessionPrecondition"
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Disabled question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestion"
        "401":
          description: No authenticated Clerk session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an administrator or account disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Question not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Malformed admin session precondition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Admin session changed; no question or topic mutation performed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    AdminSessionPrecondition:
      name: X-Admin-Session
      in: header
      required: false
      description: >-
        Optional initiating Clerk session ID, compared with server-verified Clerk
        authentication before admin writes. Not authorization evidence. The admin
        UI sends it on every write. Omission retains existing ADMIN authorization
        but provides no cross-session intent check. Malformed values return 400;
        a mismatch returns 409 ADMIN_SESSION_CHANGED, with no domain write.
        A request already authorized may finish after a browser session switch.
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[A-Za-z0-9_-]+$'
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk's same-origin session cookie; login and logout are managed by Clerk UI.
  schemas:
    AdminTopic:
      type: object
      required: [id, slug, name, description, displayOrder, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 2000
        displayOrder:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminTopicCreate:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 2000
        displayOrder:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    AdminTopicUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 2000
        displayOrder:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    AdminQuestionOption:
      type: object
      additionalProperties: false
      required: [optionKey, displayOrder, text, isCorrect]
      properties:
        optionKey:
          type: string
          minLength: 1
          maxLength: 8
        displayOrder:
          type: integer
          minimum: 0
        text:
          type: string
          minLength: 1
          maxLength: 4000
        isCorrect:
          type: boolean
    AdminQuestion:
      type: object
      additionalProperties: false
      required: [id, questionCode, topicId, text, type, difficulty, explanation, imageKey, referenceNotes, status, createdAt, updatedAt, options]
      properties:
        id:
          type: string
          format: uuid
        questionCode:
          type: string
          pattern: "^CCNA-Q-[0-9]{6,}$"
          readOnly: true
        topicId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 10000
        type:
          type: string
          enum: [MULTIPLE_CHOICE_SINGLE]
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        explanation:
          type: string
          maxLength: 10000
        imageKey:
          type: string
          maxLength: 512
          nullable: true
        referenceNotes:
          type: string
          maxLength: 10000
          nullable: true
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        options:
          type: array
          items:
            $ref: "#/components/schemas/AdminQuestionOption"
    AdminQuestionListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminQuestion"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    AdminQuestionCreate:
      type: object
      additionalProperties: false
      required: [topicId, text, type, difficulty, options]
      properties:
        topicId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 10000
        type:
          type: string
          enum: [MULTIPLE_CHOICE_SINGLE]
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        explanation:
          type: string
          maxLength: 10000
        imageKey:
          type: string
          maxLength: 512
          nullable: true
        referenceNotes:
          type: string
          maxLength: 10000
          nullable: true
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [optionKey, text, isCorrect]
            properties:
              optionKey:
                type: string
                minLength: 1
                maxLength: 8
              text:
                type: string
                minLength: 1
                maxLength: 4000
              isCorrect:
                type: boolean
    AdminQuestionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        topicId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 10000
        type:
          type: string
          enum: [MULTIPLE_CHOICE_SINGLE]
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        explanation:
          type: string
          maxLength: 10000
        imageKey:
          type: string
          maxLength: 512
          nullable: true
        referenceNotes:
          type: string
          maxLength: 10000
          nullable: true
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        options:
          type: array
          minItems: 2
          maxItems: 10
          description: When supplied, replaces the whole option list and must contain exactly one correct option.
          items:
            type: object
            additionalProperties: false
            required: [optionKey, text, isCorrect]
            properties:
              optionKey:
                type: string
                minLength: 1
                maxLength: 8
              text:
                type: string
                minLength: 1
                maxLength: 4000
              isCorrect:
                type: boolean
    LearnerQuestion:
      type: object
      required: [id, questionCode, topicId, text, type, difficulty, imageKey, options]
      properties:
        id:
          type: string
          format: uuid
        questionCode:
          type: string
        topicId:
          type: string
          format: uuid
        text:
          type: string
        type:
          type: string
          enum: [MULTIPLE_CHOICE_SINGLE]
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        imageKey:
          type: string
          nullable: true
        options:
          type: array
          items:
            type: object
            required: [optionKey, text]
            properties:
              optionKey:
                type: string
              text:
                type: string
    PracticeTopic:
      type: object
      additionalProperties: false
      required: [id, slug, name]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    PracticeQuestionOption:
      type: object
      additionalProperties: false
      required: [optionKey, text]
      properties:
        optionKey:
          type: string
        text:
          type: string
    PracticeQuestion:
      type: object
      additionalProperties: false
      required: [id, deliveryId, revisionId, expiresAt, questionCode, topic, text, type, difficulty, options]
      properties:
        id:
          type: string
          format: uuid
        deliveryId:
          type: string
          format: uuid
        revisionId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        questionCode:
          type: string
        topic:
          $ref: "#/components/schemas/PracticeTopic"
        text:
          type: string
        type:
          type: string
          enum: [MULTIPLE_CHOICE_SINGLE]
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        options:
          type: array
          items:
            $ref: "#/components/schemas/PracticeQuestionOption"
    PracticeHistoryItem:
      type: object
      additionalProperties: false
      required: [id, questionId, topicId, selectedOptionKey, isCorrect, submittedAt]
      properties:
        id:
          type: string
          format: uuid
        questionId:
          type: string
          format: uuid
        topicId:
          type: string
          format: uuid
        selectedOptionKey:
          type: string
        isCorrect:
          type: boolean
        submittedAt:
          type: string
          format: date-time
        questionCode:
          type: string
          nullable: true
          description: Present only with includeDetails=true. Snapshot question code for revised attempts; current display label only for legacy attempts.
        topicName:
          type: string
          nullable: true
          description: Present only with includeDetails=true. Snapshot topic name for revised attempts; current display label only for legacy attempts.
        revisionId:
          type: string
          format: uuid
          nullable: true
          description: Present only with includeDetails=true; null for legacy records without captured content.
        historicalContentStatus:
          type: string
          enum: [VERIFIED_SNAPSHOT, LEGACY_UNAVAILABLE]
          description: Present only with includeDetails=true. Legacy scores are preserved; original content is unknown.
        review:
          allOf:
            - $ref: "#/components/schemas/PracticeRevisionReview"
          nullable: true
          description: Immutable submission content and answer key, available only in the authenticated owner's history.
    PracticeRevisionReview:
      type: object
      additionalProperties: false
      required: [text, type, difficulty, imageKey, referenceNotes, options, correctOption, explanation]
      properties:
        text:
          type: string
        type:
          type: string
          enum: [MULTIPLE_CHOICE_SINGLE]
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        imageKey:
          type: string
          nullable: true
        referenceNotes:
          type: string
          nullable: true
        options:
          type: array
          items:
            $ref: "#/components/schemas/PracticeQuestionOption"
        correctOption:
          $ref: "#/components/schemas/PracticeCorrectOption"
        explanation:
          type: string
    PracticeHistoryResponse:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PracticeHistoryItem"
        nextCursor:
          type: string
          nullable: true
    PracticeAnswerInput:
      type: object
      additionalProperties: false
      required: [optionKey, deliveryId]
      properties:
        deliveryId:
          type: string
          format: uuid
          description: Delivery received from getPracticeQuestion; bound to the verified user and session.
        optionKey:
          type: string
          minLength: 1
          maxLength: 8
    PracticeCorrectOption:
      type: object
      additionalProperties: false
      required: [optionKey, text]
      properties:
        optionKey:
          type: string
        text:
          type: string
    PracticeAnswerResult:
      type: object
      additionalProperties: false
      required: [isCorrect, correctOption, explanation]
      properties:
        isCorrect:
          type: boolean
        correctOption:
          $ref: "#/components/schemas/PracticeCorrectOption"
        explanation:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TopicSummary:
      type: object
      required:
        - id
        - slug
        - name
        - description
        - questionCount
        - attemptedCount
        - correctCount
        - accuracy
        - averageDurationSeconds
        - progressPercent
        - displayOrder
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        questionCount:
          type: integer
          minimum: 0
        attemptedCount:
          type: integer
          minimum: 0
        correctCount:
          type: integer
          minimum: 0
        accuracy:
          type: number
          minimum: 0
          maximum: 100
        averageDurationSeconds:
          type: integer
          minimum: 0
        progressPercent:
          type: number
          minimum: 0
          maximum: 100
        displayOrder:
          type: integer
    DashboardSummary:
      type: object
      required:
        - totalTopics
        - totalQuestions
        - questionsAttempted
        - overallAccuracy
        - studyMinutes
        - streakDays
        - focusTopic
      properties:
        totalTopics:
          type: integer
          minimum: 0
        totalQuestions:
          type: integer
          minimum: 0
        questionsAttempted:
          type: integer
          minimum: 0
        overallAccuracy:
          type: number
          minimum: 0
          maximum: 100
        studyMinutes:
          type: integer
          minimum: 0
        streakDays:
          type: integer
          minimum: 0
        focusTopic:
          oneOf:
            - $ref: "#/components/schemas/TopicSummary"
            - type: "null"
    LearningProgressResponse:
      type: object
      additionalProperties: false
      required:
        - summary
        - topics
      properties:
        summary:
          $ref: "#/components/schemas/LearningProgressSummary"
        topics:
          type: array
          description: All ACTIVE topics plus DISABLED topics with this user historical attempts, sorted by displayOrder, topicName, topicId. No unrelated disabled topics are exposed.
          items:
            $ref: "#/components/schemas/LearningTopicProgress"
    LearningProgressSummary:
      type: object
      additionalProperties: false
      required:
        - totalAttempts
        - correctAttempts
        - overallAccuracy
        - uniqueQuestionsAttempted
        - availableQuestionCount
        - coveredQuestionCount
        - coveragePercent
      properties:
        totalAttempts:
          type: integer
          minimum: 0
          description: All historical attempts belonging to the authenticated internal user, regardless of current question or topic status.
        correctAttempts:
          type: integer
          minimum: 0
          description: Historical attempts whose stored is_correct value is true; never regraded from current answer options.
        overallAccuracy:
          type: number
          minimum: 0
          maximum: 100
          description: 100 * correctAttempts / totalAttempts. This is attempt-weighted accuracy, not an average of topic percentages. Rounded to at most two decimal places; zero when the denominator is zero.
        uniqueQuestionsAttempted:
          type: integer
          minimum: 0
          description: Distinct question_id values across all historical attempts, including disabled or moved questions.
        availableQuestionCount:
          type: integer
          minimum: 0
          description: Current ACTIVE questions whose current topic is ACTIVE, including questions this user has never attempted.
        coveredQuestionCount:
          type: integer
          minimum: 0
          description: Distinct currently available questions for which this user has any historical attempt, regardless of its stored topic_id or correctness.
        coveragePercent:
          type: number
          minimum: 0
          maximum: 100
          description: 100 * coveredQuestionCount / availableQuestionCount. Measures current catalog coverage, not mastery. Rounded to at most two decimal places; zero when the denominator is zero.
    LearningTopicProgress:
      type: object
      additionalProperties: false
      required:
        - topicId
        - topicName
        - status
        - displayOrder
        - totalAttempts
        - correctAttempts
        - accuracy
        - uniqueQuestionsAttempted
        - availableQuestionCount
        - coveredQuestionCount
        - coveragePercent
      properties:
        topicId:
          type: string
          format: uuid
          description: Existing topic ID. Matches stored attempt.topic_id for historical metrics and current question.topic_id for coverage.
        topicName:
          type: string
          minLength: 1
          maxLength: 180
          description: Current topic name; historical names are not snapshotted.
        status:
          type: string
          enum:
            - ACTIVE
            - DISABLED
          description: Current topic status. A DISABLED topic is returned only when this user has historical attempts attributed to it.
        displayOrder:
          type: integer
          description: Current catalog display order; topics are sorted by displayOrder, topicName, then topicId.
        totalAttempts:
          type: integer
          minimum: 0
          description: Historical attempts belonging to this user with stored topic_id equal to topicId.
        correctAttempts:
          type: integer
          minimum: 0
          description: Those historical topic attempts with stored is_correct = true.
        accuracy:
          type: number
          minimum: 0
          maximum: 100
          description: 100 * correctAttempts / totalAttempts for this historical topic cohort. Rounded to at most two decimal places; zero when the denominator is zero.
        uniqueQuestionsAttempted:
          type: integer
          minimum: 0
          description: Distinct question_id values in this user historical attempts attributed to this topic; includes disabled or subsequently moved questions.
        availableQuestionCount:
          type: integer
          minimum: 0
          description: Current ACTIVE questions assigned to this topic when the topic is ACTIVE; zero for a DISABLED topic.
        coveredQuestionCount:
          type: integer
          minimum: 0
          description: Distinct currently available questions in this topic with any historical attempt by this user, including attempts originally attributed to another topic.
        coveragePercent:
          type: number
          minimum: 0
          maximum: 100
          description: 100 * coveredQuestionCount / availableQuestionCount for this current topic catalog. Rounded to at most two decimal places; zero when the denominator is zero.
    CurrentUser:
      type: object
      required:
        - id
        - email
        - displayName
        - role
        - status
        - createdAt
        - updatedAt
        - lastLoginAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
    CurrentUserResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: "#/components/schemas/CurrentUser"
    AdminAccessResponse:
      type: object
      required:
        - allowed
        - role
      properties:
        allowed:
          type: boolean
          enum: [true]
        role:
          type: string
          enum: [ADMIN]
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string

