components:
  parameters:
    AdminSessionPrecondition:
      name: X-Admin-Session
      in: header
      required: false
      description: >-
        Optional initiating Clerk session ID, compared with server-verified Clerk
        authentication before admin writes. Not authorization evidence. The admin
        UI sends it on every write. Omission retains existing ADMIN authorization
        but provides no cross-session intent check. Malformed values return 400;
        a mismatch returns 409 ADMIN_SESSION_CHANGED, with no domain write.
        A request already authorized may finish after a browser session switch.
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^[A-Za-z0-9_-]+$'
  securitySchemes:
    clerkSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk's same-origin session cookie; login and logout are managed by Clerk UI.
  schemas:
    AdminTopic:
      type: object
      required: [id, slug, name, description, displayOrder, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 2000
        displayOrder:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminTopicCreate:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 2000
        displayOrder:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    AdminTopicUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 120
        name:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 2000
        displayOrder:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [ACTIVE, DISABLED]
    AdminQuestionOption:
      type: object
      additionalProperties: false
      required: [optionKey, displayOrder, text, isCorrect]
      properties:
        optionKey:
          type: string
          minLength: 1
          maxLength: 8
        displayOrder:
          type: integer
          minimum: 0
        text:
          type: string
          minLength: 1
          maxLength: 4000
        isCorrect:
          type: boolean
    AdminQuestion:
      type: object
      additionalProperties: false
      required: [id, questionCode, topicId, text, type, difficulty, explanation, imageKey, referenceNotes, status, createdAt, updatedAt, options]
      properties:
        id:
          type: string
          format: uuid
        questionCode:
          type: string
          pattern: "^CCNA-Q-[0-9]{6,}$"
          readOnly: true
        topicId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 10000
        type:
          type: string
          enum: [MULTIPLE_CHOICE_SINGLE, MULTIPLE_CHOICE_MULTIPLE]
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        explanation:
          type: string
          maxLength: 10000
        imageKey:
          type: string
          maxLength: 512
          nullable: true
        referenceNotes:
          type: string
          maxLength: 10000
          nullable: true
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        options:
          type: array
          items:
            $ref: "#/components/schemas/AdminQuestionOption"
    AdminQuestionListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminQuestion"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    AdminQuestionCreate:
      type: object
      additionalProperties: false
      required: [topicId, text, type, difficulty, options]
      properties:
        topicId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 10000
        type:
          type: string
          enum: [MULTIPLE_CHOICE_SINGLE, MULTIPLE_CHOICE_MULTIPLE]
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        explanation:
          type: string
          maxLength: 10000
        imageKey:
          type: string
          maxLength: 512
          nullable: true
        referenceNotes:
          type: string
          maxLength: 10000
          nullable: true
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            type: object
            additionalProperties: false
            required: [optionKey, text, isCorrect]
            properties:
              optionKey:
                type: string
                minLength: 1
                maxLength: 8
              text:
                type: string
                minLength: 1
                maxLength: 4000
              isCorrect:
                type: boolean
    AdminQuestionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        topicId:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 10000
        type:
          type: string
          enum: [MULTIPLE_CHOICE_SINGLE, MULTIPLE_CHOICE_MULTIPLE]
        difficulty:
          type: string
          enum: [EASY, MEDIUM, HARD]
        explanation:
          type: string
          maxLength: 10000
        imageKey:
          type: string
          maxLength: 512
          nullable: true
        referenceNotes:
          type: string
          maxLength: 10000
          nullable: true
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        options:
          type: array
          minItems: 2
          maxItems: 10
          description: When supplied, replaces the whole option list and must contain exactly one correct option.
          items:
            type: object
            additionalProperties: false
            required: [optionKey, text, isCorrect]
            properties:
              optionKey:
                type: string
                minLength: 1
                maxLength: 8
              text:
                type: string
                minLength: 1
                maxLength: 4000
              isCorrect:
                type: boolean
    LearnerQuestion:
      type: object
      required: [id, questionCode, topicId, text, type, difficulty, imageKey, options]
      properties:
        requiredSelectionCount:
          type: integer
          minimum: 2
          maximum: 10
        id:
          type: string
          format: uuid
        questionCode:
          type: string
        topicId:
          type: string
          format: uuid
        text:
          type: string
        type:
