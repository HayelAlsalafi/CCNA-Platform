<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Proposed Lesson Studio — preview left, editor right</title>
  <desc id="desc">Static approval wireframe only. Equal-width preview and editing panes fill the available workspace beside a collapsed NEXUS navigation rail. No real lesson data or application implementation.</desc>
